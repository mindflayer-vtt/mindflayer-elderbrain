menuentry "Install Mindflayer Elderbrain" {
    set gfxpayload=keep
    # The Innostor IS918 controller can report no media when the default
    # one-second USB-storage scan races its initialization on older xHCI hosts.
    linux /casper/vmlinuz autoinstall ds=nocloud\;s=/cdrom/ usbcore.quirks=1f75:0918:g usb-storage.delay_use=5 ---
    initrd /casper/initrd
}
